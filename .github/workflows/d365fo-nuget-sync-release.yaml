name: D365FO NuGet Sync - Build & Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.1.4

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # Permission to create/update releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PowerShell script to EXE
        shell: powershell
        run: |
          # Download ps2exe converter (open-source)
          $ps2exeUrl = "https://github.com/MScholtes/PS2EXE/releases/download/v0.5.0.15/ps2exe.zip"
          $tempDir = "$env:TEMP\ps2exe"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          
          # Download and extract ps2exe
          Write-Host "Downloading PS2EXE converter..."
          Invoke-WebRequest -Uri $ps2exeUrl -OutFile "$tempDir\ps2exe.zip" -UseBasicParsing
          Expand-Archive -Path "$tempDir\ps2exe.zip" -DestinationPath $tempDir -Force
          
          # Build EXE
          Write-Host "Building Sync-D365FONuGet.exe..."
          $ps2exePath = Get-ChildItem -Path $tempDir -Filter "ps2exe.ps1" -Recurse | Select-Object -First 1
          if ($ps2exePath) {
            & $ps2exePath.FullName -inputFile "Sync-D365FONuGet.ps1" `
              -outputFile "Sync-D365FONuGet.exe" `
              -title "D365 F&O NuGet Sync" `
              -description "One-click sync of D365 F&O NuGet packages from LCS to Azure DevOps Artifacts feed" `
              -version "${{ github.ref_name }}" `
              -company "Vinod Kumar K J" `
              -copyright "Copyright (c) 2026 Vinod Kumar K J. MIT License." `
              -iconFile $null
            Write-Host "EXE built successfully"
          } else {
            Write-Error "ps2exe.ps1 not found"
            exit 1
          }

      - name: Verify EXE was created
        shell: powershell
        run: |
          if (Test-Path "Sync-D365FONuGet.exe") {
            $size = (Get-Item "Sync-D365FONuGet.exe").Length
            Write-Host "EXE file size: $($size / 1KB)KB"
            if ($size -lt 100KB) {
              Write-Error "EXE appears to be too small - build may have failed"
              exit 1
            }
          } else {
            Write-Error "EXE file not found after build"
            exit 1
          }

      - name: Create distribution zip
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace 'v', ''
          $zipName = "Sync-D365FONuGet-$version.zip"
          
          # Create staging folder
          $staging = ".\staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "Sync-D365FONuGet.exe" $staging
          Copy-Item "Sync-D365FONuGet.ps1" $staging
          Copy-Item "LICENSE" $staging -ErrorAction SilentlyContinue
          Copy-Item "README.md" $staging -ErrorAction SilentlyContinue
          
          # Create zip
          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          
          # Verify zip
          $zipSize = (Get-Item $zipName).Length
          Write-Host "Zip file size: $($zipSize / 1KB)KB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Sync-D365FONuGet.exe
            Sync-D365FONuGet.ps1
            Sync-D365FONuGet-*.zip
          body: |
            ## Release ${{ github.ref_name }}
            
            ### Download Options
            
            **Option 1: Compiled EXE (recommended for most users)**
            - Download: `Sync-D365FONuGet.exe`
            - Features: Auto-update support, simple execution
            - Usage: Place in a folder, run directly
            
            **Option 2: Distribution ZIP**
            - Download: `Sync-D365FONuGet-*.zip`
            - Includes: EXE + Script + License + README
            - Features: Easy sharing/deployment, all dependencies included
            
            **Option 3: PowerShell Script (portable)**
            - Download: `Sync-D365FONuGet.ps1`
            - Features: No compilation required, inspect source code
            - Usage: `.\Sync-D365FONuGet.ps1`
            - Note: Auto-update not available when running as script
            
            ### What's New
            See [CHANGELOG.md](./CHANGELOG.md) for detailed changes.
            
            ### Quick Start
            1. Download preferred option above
            2. Extract ZIP (if applicable)
            3. Run: `.\Sync-D365FONuGet.exe` or `.\Sync-D365FONuGet.ps1`
            4. Follow prompts for ADO configuration
            
            ### Requirements
            - Windows 7+ or PowerShell 7+ (Linux/macOS)
            - Azure DevOps organization with Artifacts feed
            - Personal Access Token (Packaging Read & Write scope)
            - D365 F&O NuGet packages from LCS
            
            ### Support
            - GitHub Issues: [Report a bug](../../issues)
            - Questions: Check [README.md](./README.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          if (Test-Path "staging") { Remove-Item "staging" -Recurse -Force }
          if (Test-Path "$env:TEMP\ps2exe") { Remove-Item "$env:TEMP\ps2exe" -Recurse -Force }
